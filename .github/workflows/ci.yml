name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Offline play is checked in every major engine (ticket 0158): tests/e2e/offline.spec.js
      # also runs in Firefox and WebKit (Safari) projects when those browsers are installed.
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Backlog, unit tests, build, e2e
        run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
